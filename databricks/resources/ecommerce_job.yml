resources:
  jobs:
    ecommerce_medallion:
      name: ecommerce-medallion

      # En mode "development" les schedules sont automatiquement en pause.
      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # toutes les heures
        timezone_id: UTC
        pause_status: PAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_ingest
          existing_cluster_id: ${var.cluster_id}
          # Auto Loader s'arrête quand le schéma évolue : un retry suffit à reprendre
          max_retries: 1
          spark_python_task:
            python_file: ../src/bronze_ingest.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --raw-bucket
              - ${var.raw_bucket}

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: ../src/silver_transform.py
            parameters:
              - --catalog
              - ${var.catalog}

        - task_key: gold_kpis
          depends_on:
            - task_key: silver_transform
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: ../src/gold_kpis.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --abandon-after-hours
              - ${var.abandon_after_hours}
